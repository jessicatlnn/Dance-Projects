{% extends "layout.html" %}

{% block title %}Rekisteröinti{% endblock %}

{% block content %}
  <h2>Rekisteröinti</h2>

  {% if error %}
    <p>{{ error }}</p>
  {% endif %}

  <form action="/create" method="post">

    <p>
      Tunnus: <br />
        <input type="text" name="username" value="{{ username or ''}}" />
      <br />
      Vähintään 3 merkkiä, ei välilyöntejä.
    </p>

    <p>
      Salasana: <br />
        <input type="password" name="password1" />
      <br />
      Vähintään 6 merkkiä.
    </p>

    <p>
      Salasana uudestaan: <br />
        <input type="password" name="password2" />
    </p>

    <input type="submit" value="Luo tunnus" />

  </form>
{% endblock %}
