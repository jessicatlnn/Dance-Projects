{% extends "layout.html" %}

{% block title %}Rekisteröinti{% endblock %}

{% block content %}
  <h2>Rekisteröinti</h2>

  {% for message in get_flashed_messages() %}
    <p><b>{{ message }}</b></p>
  {% endfor %}

  <form action="/create" method="post">

    <p>
      <label for="username">Tunnus:</label><br />
      <input type="text" id="username" name="username" value="{{ filled.username }}" />
      <br />
      Vähintään 3 merkkiä, ei välilyöntejä.
    </p>

    <p>
      <label for="password1">Salasana:</label><br />
      <input type="password" id="password1" name="password1" />
      <br />
      Vähintään 6 merkkiä.
    </p>

    <p>
      <label for="password2">Salasana uudestaan:</label><br />
      <input type="password" id="password2" name="password2" />
    </p>

    <input type="submit" value="Luo tunnus" />

  </form>
{% endblock %}
