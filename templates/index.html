{% extends "layout.html" %}

{% block title %}Tanssiprojektit{% endblock %}

{% block content %}
    <h2>Tanssiprojektit</h2>

    <ul>
        {% for project in projects %}
            <div class="project-content">
                <a href="/project/{{ project.id }}">{{ project.title }}</a>
                <p>{{ project.username }}, {{ project.creation_date }}</p>
            </div>
        {% endfor %}
    </ul>
{% endblock %}
