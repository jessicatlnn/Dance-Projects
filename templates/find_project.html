<!DOCTYPE html>
<html>

<head>
  <title>Etsi tanssiprojekti</title>
</head>

<body>
    <h1>Etsi tanssiprojektit</h1>

    <form action="/find_project" method="get">
        <p>
            Hakusana: <input type="text" name="query" value="{{ query }}">
        </p>
        <input type="submit" value="Lähetä">
    </form>
    
    <p>
        <a href="/">Takaisin</a>
    </p>
    {% if query %}
    <h2>Tulokset</h2>
    
    <ul>
        {% for project in results %}
        <li><a href="/project/{{ project.id }}">{{ project.title }}</a></li>
        {% endfor %}
    </ul>
    {% endif %}
</body>

</html>
