{% extends "layout.html" %}

{% block title %}Etsi tanssiprojekti{% endblock %}

{% block content %}
    <h2>Etsi tanssiprojekti</h2>

    <form action="/find_project" method="get">
        <p>
            Hakusana: <input type="text" name="query" value="{{ query }}">
        </p>
        <input type="submit" value="Etsi tanssiprojekti">
    </form>
    
    <p>
        <a href="/">Takaisin</a>
    </p>
    {% if query %}
    <h2>Tulokset</h2>
    
    <ul>
        {% for project in results %}
        <li><a href="/project/{{ project.id }}">{{ project.title }}</a></li>
        {% endfor %}
    </ul>
    {% endif %}
{% endblock %}
