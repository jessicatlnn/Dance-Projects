<!DOCTYPE html>
<html>

<head>
  <title>Tanssiprojektin muokkaus</title>
</head>

<body>
  <h1>Tanssiprojektin muokkaus</h1>
  <form action="/update_project" method="post">

    {% if error %}
      <p>{{ error }}</p>
    {% endif %}

    <p>
      Projektin nimi: <br />
      <input type="text" name="title" value="{{ project.title }}" maxlength="50" required/>
    </p>

    <p>
      Kuvaus: <br /> 
      <textarea name="description" rows="8" cols="60" maxlength="1000" required>{{ project.description }}</textarea>
    </p>

    <p>
      Tanssityyli: <br />
      <select name="dance_style" required>
        {% for style in dance_styles %}
          <option value="{{ style.id }}"
            {% if style.id == project.dance_style_id %}selected{% endif %}>
            {{ style.name }}
    </option>
        {% endfor %}
      </select>
    </p>

    <p>
      Taso: <br />
      <select name="level" required>
        <option value="" disabled {% if not project.level %}selected{% endif %}>(valitse)</option>
        <option value="alkeistaso" {% if project.level == "alkeistaso" %}selected{% endif %}>Alkeistaso</option>
        <option value="keskitaso" {% if project.level == "keskitaso" %}selected{% endif %}>Keskitaso</option>
        <option value="jatkotaso" {% if project.level == "jatkotaso" %}selected{% endif %}>Jatkotaso</option>
        <option value="mestaritaso"{% if project.level == "mestaritaso" %}selected{% endif %}>Mestaritaso</option>
        <option value="avoin taso" {% if project.level == "avoin_taso" %}selected{% endif %}>Avoin taso</option>
      </select>
    </p>

    <p>
      Sijainti: <br />
        {% for location in locations %}
          <label>
            <input type="checkbox" name="locations" value="{{ location.id }}"
            {% if location.id in project_location_ids %}checked{% endif %}>
            {{ location.name }}
          </label>
        {% endfor %}
    </p>

    <input type="hidden" name="project_id" value="{{ project.id }}" />
    <input type="submit" value="Päivitä tanssiprojekti" />
  </form>
</body>

</html>
