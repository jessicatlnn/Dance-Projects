<!DOCTYPE html>
<html>

<head>
  <title>Tanssiprojektin muokkaus</title>
</head>

<body>
  <h1>Tanssiprojektin muokkaus</h1>
  <form action="/update_project" method="post">

    {% if error %}
      <p>{{ error }}</p>
    {% endif %}

    <p>
      Projektin nimi: <br />
      <input type="text" name="title" value="{{ title }}" maxlength="50" required/>
    </p>

    <p>
      Kuvaus: <br /> 
      <textarea name="description" rows="8" cols="60" maxlength="1000" required>{{ description }}</textarea>
    </p>

    <p>
      Tanssityyli: <br />
      <select name="dance_style" required>
        {% for style in dance_styles %}
          <option value="{{ style.id }}"
            {% if style.id|string == dance_style_id|string %}selected{% endif %}>
            {{ style.name }}
          </option>
        {% endfor %}
      </select>
    </p>

    <p>
      Taso: <br />
      <select name="level" required>
        <option value="" disabled>(valitse)</option>
        {% for level in levels %}
          <option value="{{ level.id }}"
            {% if level.id|string == level_id|string %}selected{% endif %}>
            {{ level.name }}
          </option>
        {% endfor %}
      </select>
    </p>
    <p>
      Sijainti: <br />
      {% for location in locations %}
        <label>
          <input type="checkbox" name="locations" value="{{ location.id }}"
            {% if location.id|string in location_ids|map('string')|list %}checked{% endif %}>
          {{ location.name }}
        </label>
      {% endfor %}
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="hidden" name="project_id" value="{{ project.id }}" />
    <input type="submit" value="Päivitä tanssiprojekti" />
    <a href="/project/{{ project.id }}">Peruuta</a>
  </form>
</body>

</html>
